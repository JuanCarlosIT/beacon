name: gab-fumigaciones-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${DB_NAME:-fumigaciones_pruebas}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_USER: ${DB_USER:-fumigaciones_app}
      APP_DB_PASSWORD_FILE: /run/secrets/postgres_app_password
    ports:
      - '127.0.0.1:${POSTGRES_LOCAL_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/docker-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    secrets:
      - postgres_admin_password
      - postgres_app_password
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:

secrets:
  postgres_admin_password:
    file: ./backend/.docker/postgres-admin-password
  postgres_app_password:
    file: ./backend/.docker/postgres-app-password
